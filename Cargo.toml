[workspace]
members = ["crates/launcher-core", "crates/launcher"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/2011Scape/void-launcher"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# Keep the symbol table: fully stripped, unsigned binaries look "packed" to
# antivirus heuristics (Windows Defender flagged 2.1.0 as Wacatac.B!ml).
strip = "debuginfo"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
