[package]
name = "void-launcher"
description = "Void launcher: downloads, updates and starts the 634 client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "void-launcher"
path = "src/main.rs"

[dependencies]
launcher-core = { path = "../launcher-core" }
iced = { version = "0.14", features = ["tokio", "image", "svg", "sipper", "advanced"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
rfd = "0.17"
open = "5"
tracing = "0.1"
time = { version = "0.3", features = ["parsing"] }

[build-dependencies]
winresource = "0.1"
