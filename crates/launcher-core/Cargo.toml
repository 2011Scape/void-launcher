[package]
name = "launcher-core"
description = "Void launcher: settings, updates, Java detection and client launching (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "fs", "process", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip", "http2"] }
futures-util = "0.3"
sipper = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
dirs = "6"
open = "5"
self-replace = "1.5"
which = "8"
shlex = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
