name: Release

# Two release channels, the same scheme as 634-client:
#   Stable       a tag vX.Y.Z publishes a release of that name; GitHub's "latest" is the newest of them.
#   Development  every push to main rebuilds the one pre-release tagged "dev" (the tag moved to the
#                commit, the release made again with the new files), versioned <cargo>-dev.<sha>.
# A pull request that touches this file is a dry run: it builds everything and publishes nothing.
#
# The Windows exe is Authenticode-signed by SignPath when the SIGNPATH_* repository variables and
# the SIGNPATH_API_TOKEN secret are set (see the sign-windows job); otherwise it ships unsigned.
#
# Every release carries: void-launcher-windows-x86_64.exe, void-launcher-linux-x86_64,
# void-launcher-linux-x86_64.AppImage, void-launcher-macos-universal.app.zip, manifest.json
# (read by the launcher's self-updater) and SHA256SUMS.
#
# Cut a release: bump `version` in Cargo.toml, commit, then `git tag v1.2.0 && git push origin v1.2.0`
# (`just release 1.2.0` does all three). The check job refuses a tag that does not match Cargo.toml.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths: [".github/workflows/release.yml", "ci/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # One timestamp for every job, so manifest.json and the binaries agree.
  BUILT_AT: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ci/check-version.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: windows-x86_64
            os: windows-latest
          - target: macos-universal
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libfuse2 file binutils
      - name: Build and package
        shell: bash
        run: ci/build.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.target }}
          path: |
            out/void-launcher-*
            !out/*-apple-darwin
          if-no-files-found: error

  # Authenticode-signs the Windows exe through SignPath (free for open source via the
  # SignPath Foundation). Active only once the repository variables exist; until then the
  # exe ships unsigned. Tags use the release-signing policy, which waits for a maintainer's
  # approval in the SignPath portal; everything else uses test-signing.
  sign-windows:
    needs: build
    if: github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Find the Windows build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[] | select(.name == "out-windows-x86_64") | .id')"
          [ -n "$id" ] || { echo "no out-windows-x86_64 artifact"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'void-launcher' }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.artifact.outputs.id }}
          wait-for-completion: true
          # release-signing needs a human click; give them a while.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Check the signature
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends osslsigncode
          ls -la signed
          osslsigncode verify -in signed/void-launcher-windows-x86_64.exe -CAfile /etc/ssl/certs/ca-certificates.crt || osslsigncode verify -in signed/void-launcher-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: out-windows-x86_64-signed
          path: signed/void-launcher-windows-x86_64.exe
          if-no-files-found: error

  dist:
    needs: [build, sign-windows]
    # Run whether signing ran or was skipped, but not when it failed.
    if: always() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: out-{linux-x86_64,macos-universal}
          path: out
          merge-multiple: true
      - name: Windows exe, signed
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: out-windows-x86_64-signed
          path: out
      - name: Windows exe, unsigned
        if: needs.sign-windows.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: out-windows-x86_64
          path: out
      - name: Assemble manifest.json and SHA256SUMS
        run: |
          ci/make-dist.sh
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [dist, sign-windows]
    # A stable tag, or a push to main; never a pull request's dry run.
    if: always() && needs.dist.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_NOTE: ${{ needs.sign-windows.result == 'success'
        && 'The Windows executable is Authenticode-signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).'
        || 'The Windows executable is not yet code-signed; if SmartScreen appears choose More info, then Run anyway.' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish the stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "Pick the file for your system; the launcher keeps itself and the game client up to date afterwards."
            echo
            echo "- Windows 10/11 (64-bit): \`void-launcher-windows-x86_64.exe\`"
            echo "- macOS 10.15+ (Intel and Apple Silicon): \`void-launcher-macos-universal.app.zip\` (not notarized: right-click the app and choose Open the first time)"
            echo "- Linux: \`void-launcher-linux-x86_64.AppImage\` (make it executable first) or the plain binary"
            echo
            echo "$SIGNING_NOTE"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/void-launcher-* dist/manifest.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Void Launcher ${GITHUB_REF_NAME#v}" --generate-notes --notes-file notes.md
      # The dev tag is moved to this commit, the old pre-release removed and a new one made from it:
      # the page https://github.com/<repo>/releases/tag/dev stays the same.
      - name: Publish the development build
        if: github.ref == 'refs/heads/main'
        run: |
          source dist/build.env
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/dev" -f sha="$GITHUB_SHA"
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes || true
          {
            echo "Development build \`$VERSION\` from \`main\` at ${GITHUB_SHA::7}."
            echo
            echo "This pre-release is replaced by every push to main. The [latest stable release](https://github.com/$GITHUB_REPOSITORY/releases/latest) is the one to keep."
            echo
            echo "$SIGNING_NOTE"
          } > notes.md
          gh release create dev dist/void-launcher-* dist/manifest.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Development build $VERSION" --prerelease --notes-file notes.md
